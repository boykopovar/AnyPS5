services:
  engine:
    image: anyps5-engine:local
    pull_policy: build
    build:
      context: .
      dockerfile: tools/engine/Dockerfile
      args:
        ANYPS5_UPSTREAM_REF: ${ANYPS5_UPSTREAM_REF:-3c07e1d05e545cb5988041da0fa63ea8dd36673e}
        ANYPS5_BUILD_JOBS: ${ANYPS5_BUILD_JOBS:-4}
        ANYPS5_CACHE_SCOPE: ${ANYPS5_CACHE_SCOPE:-default}
  setup:
    image: anyps5-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: tools/launcher/web/Dockerfile
  web:
    image: anyps5-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: tools/launcher/web/Dockerfile
