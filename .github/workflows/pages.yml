name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - CMakeLists.txt
      - core/relinker/**
      - demo/web/**
      - tools/build_web.py
      - tools/package_release.py
      - tools/nid_names.py
      - tools/progress.py
      - tools/shader_scan.py
      - tools/rdna2_isa_forms.txt
      - tools/progress_history.py
      - tools/rdna_isa.txt
      - tools/test_web.py
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: ${{ !github.event.repository.fork && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Download matching release converter and libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_web.py --build build-wasm --release
      - run: python3 tools/progress.py --require-shader-source build-wasm/web
      - run: python3 tools/progress_history.py build-wasm/web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build-wasm/web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
