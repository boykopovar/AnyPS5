name: Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download WebAssembly from the matching release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          git fetch --depth=1 origin "refs/tags/$tag"
          tag_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$tag_sha" != "$RELEASE_WORKFLOW_SHA" ]]; then
            echo "::error::Latest release $tag does not match the completed Release workflow commit"
            exit 1
          fi
          mkdir -p build-wasm/web/native
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'relinker_wasm.mjs' --pattern 'relinker_wasm.wasm' \
            --dir build-wasm/web/native
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Package the matching release libraries and web files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_web.py --build build-wasm --libraries --release-tag "${{ steps.release.outputs.tag }}"
      - name: Test web converter
        run: python3 tools/test_web.py --build build-wasm
      - name: Verify packaged release manifest
        run: test -s build-wasm/web/release.json
      - run: python3 tools/progress.py build-wasm/web
      - run: python3 tools/progress_history.py build-wasm/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-wasm/web
      - id: deployment
        uses: actions/deploy-pages@v5
