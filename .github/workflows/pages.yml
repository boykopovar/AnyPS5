name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/pages-progress.yml
      - CMakeLists.txt
      - core/relinker/**
      - demo/web/**
      - tools/build_web.py
      - tools/package_release.py
      - tools/nid_names.py
      - tools/progress.py
      - tools/progress_prs.py
      - tools/pr_overlap.py
      - tools/shader_scan.py
      - tools/rdna2_isa_forms.txt
      - tools/progress_history.py
      - tools/rdna_isa.txt
      - tools/test_web.py
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: ${{ !github.event.repository.fork && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Download matching release converter and libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_web.py --build build-wasm --release
      - name: Prepare the open-PR estimate fallback
        run: |
          python3 - "$RUNNER_TEMP/open-pr-progress.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"available": False,
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "reason": "estimator failed before producing a result"}) + "\n", encoding="utf-8")
          PY
      - name: Estimate open-PR library progress
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: python3 tools/progress_prs.py --output "$RUNNER_TEMP/open-pr-progress.json"
      - run: python3 tools/progress.py --require-shader-source --open-pr-estimate "$RUNNER_TEMP/open-pr-progress.json" build-wasm/web
      - run: python3 tools/progress_history.py build-wasm/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-wasm/web
      - id: deployment
        uses: actions/deploy-pages@v5
