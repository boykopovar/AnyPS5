name: Experimental guest CPU (iOS Simulator)

on:
  push:
    branches:
      - experiment/ios-arm64-cpu-interpreter
  workflow_dispatch:

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Boot an iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices|to_entries[]|select(.key|test("iOS"))|.value[]|select(.isAvailable and (.name|startswith("iPhone")))]|sort_by(.state != "Booted")|.[0].udid')
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Configure for the iOS Simulator
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          echo "Host architecture: $ARCH"
          cmake -S experimental/arm64-cpu -B guest-cpu-ios-sim -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_CROSSCOMPILING_EMULATOR="/usr/bin/xcrun;simctl;spawn;${{ steps.sim.outputs.udid }}"

      - name: Build
        run: cmake --build guest-cpu-ios-sim

      - name: Sign the test bundles
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in guest-cpu-ios-sim/*.app; do
            echo "Signing $app"
            codesign --force --sign - "$app"
          done

      - name: Run the tests on the simulator
        run: ctest --test-dir guest-cpu-ios-sim --output-on-failure --timeout 300
