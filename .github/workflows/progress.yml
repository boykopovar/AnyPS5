name: Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -e
          set -o pipefail
          log=$RUNNER_TEMP/progress.log
          python3 tools/progress.py out | tee "$log"
          {
            echo "## Progress"
            echo ""
            grep -E '^libraries |^shaders ' "$log"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
