name: Progress comment

on:
  workflow_run:
    workflows: [Progress report]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: progress-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          pr=$(cat pr)
          [[ $pr =~ ^[0-9]+$ ]] || exit 1
          head_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          if [ "$head_sha" != "$RUN_SHA" ]; then
            echo "progress comment sync: skipped stale run on PR #$pr (head ${head_sha:0:7}, workflow ${RUN_SHA:0:7})"
            exit 0
          fi
          marker='<!-- progress-report -->'
          comment=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | [.id, .body] | @json" | head -n1 || true)
          id=$(jq -r '.[0] // empty' <<< "${comment:-null}")
          if [ -f report.md ]; then
            printf '%s\n%s' "$marker" "$(cat report.md)" > body.md
            if [ -n "$id" ]; then
              if [ "$(jq -r '.[1]' <<< "${comment:-null}")" = "$(cat body.md)" ]; then
                echo "progress comment sync: unchanged comment on PR #$pr"
              else
                gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@body.md > /dev/null
              fi
            else
              gh pr comment "$pr" --body-file body.md
            fi
          elif [ -n "$id" ]; then
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
          fi
