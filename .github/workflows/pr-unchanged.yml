name: PR already in main
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr-already-in-main
jobs:
  unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -I tools/pr_unchanged.py
