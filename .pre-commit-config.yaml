# pre-commit configuration for AnyPS5.
#
# Hooks run automatically on staged files (git commit) and, in CI, on the
# whole tree via `pre-commit run --all-files` (.github/workflows/pre-commit.yml).
#
# Style baseline: core/ is formatted with .clang-format (LLVM base, 4-space
# indent, 120-column limit). Vendored code under 3rdparty/ is intentionally
# excluded from every hook.

exclude: ^3rdparty/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]