name: anyps5-launcher
services:
  engine:
    image: ${ANYPS5_IMAGE_REGISTRY:-ghcr.io/cramessar}/anyps5-engine:${ANYPS5_IMAGE_TAG:-main}
    volumes:
      - ${ANYPS5_ENGINE_DIR:-./.local/engine-artifacts}:/artifacts
    restart: "no"
  setup:
    image: ${ANYPS5_IMAGE_REGISTRY:-ghcr.io/cramessar}/anyps5-web:${ANYPS5_IMAGE_TAG:-main}
    command: ["python", "/app/state.py"]
    user: "0:0"
    volumes:
      - type: bind
        source: ${ANYPS5_WEB_STATE_DIR:-./.local/launcher-web}
        target: /state
        bind:
          create_host_path: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"
  web:
    depends_on:
      setup:
        condition: service_completed_successfully
    image: ${ANYPS5_IMAGE_REGISTRY:-ghcr.io/cramessar}/anyps5-web:${ANYPS5_IMAGE_TAG:-main}
    ports:
      - "127.0.0.1:${ANYPS5_WEB_PORT:-8766}:8765"
    environment:
      ANYPS5_WEB_ORIGINS: "http://127.0.0.1:${ANYPS5_WEB_PORT:-8766},http://localhost:${ANYPS5_WEB_PORT:-8766}"
      ANYPS5_WEB_STATE: /state/backend
      ANYPS5_WEB_TOKEN_FILE: /state/auth.token
      ANYPS5_ENGINE_ROOT: /engine
    volumes:
      - type: bind
        source: ${ANYPS5_WEB_STATE_DIR:-./.local/launcher-web}
        target: /state
        bind:
          create_host_path: true
      - type: bind
        source: ${ANYPS5_ENGINE_DIR:-./.local/engine-artifacts}
        target: /engine
        read_only: true
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
